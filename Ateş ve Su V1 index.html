<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ateş ve Su - Düzeltilmiş Parkur</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 1000px;
            height: 580px;
            background-color: #161622;
            border: 4px solid #2b2b3d;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
        }
        canvas {
            background-color: #0f0f17;
            display: block;
            border-radius: 8px;
        }
        .ad-banner {
            position: absolute;
            top: 12px;
            right: 15px;
            background: rgba(13, 13, 18, 0.85);
            border: 2px solid #00d2ff;
            color: #00d2ff;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            pointer-events: none;
            z-index: 10;
        }
        .controls-container {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .player-controls {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .btn {
            width: 65px;
            height: 65px;
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
        }
        .btn:active {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        .red-btn {
            border-color: #ff4757;
            background-color: rgba(255, 71, 87, 0.25);
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.2);
        }
        .blue-btn {
            border-color: #1e90ff;
            background-color: rgba(30, 144, 255, 0.25);
            box-shadow: 0 0 10px rgba(30, 144, 255, 0.2);
        }
        .overlay-card {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 25, 0.95);
            padding: 30px 50px;
            border-radius: 16px;
            border: 2px solid #00d2ff;
            text-align: center;
            z-index: 20;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }
        .overlay-card h2 {
            margin: 0 0 10px 0;
            color: #fff;
            font-size: 28px;
        }
        .overlay-card p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .overlay-card button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #2ed573, #1e90ff);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
        #backBtn {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            background: #ff4757;
            border: 2px solid #ff6b81;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            z-index: 15;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
        }
        #backBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="ad-banner">Github #patletico12</div>
    <canvas id="gameCanvas" width="1000" height="580"></canvas>
    
    <div id="levelMessage" class="overlay-card">
        <h2 id="msgTitle">LEVEL 1 COMPLETED!</h2>
        <p id="msgSub">Awesome teamwork! Portals unlocked.</p>
        <button id="msgBtn" onclick="nextLevel()">Go to Level 2</button>
    </div>

    <button id="backBtn" onclick="backToLevel1()">◄ Back to Level 1</button>

    <!-- Dokunmatik Kontroller -->
    <div class="controls-container">
        <!-- Ateş (Kırmızı) - Solda -->
        <div class="player-controls">
            <div class="btn red-btn" id="redLeft">◄</div>
            <div class="btn red-btn" id="redUp">▲</div>
            <div class="btn red-btn" id="redRight">►</div>
        </div>
        <!-- Su (Mavi) - Sağda -->
        <div class="player-controls">
            <div class="btn blue-btn" id="blueLeft">◄</div>
            <div class="btn blue-btn" id="blueUp">▲</div>
            <div class="btn blue-btn" id="blueRight">►</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentLevel = 1;
const keys = {};
let portalAnim = 0;

// Karakterler ve Başlangıç Konumları
const p1 = { startX: 50, startY: 500, x: 50, y: 500, w: 26, h: 26, vx: 0, vy: 0, color: '#ff4757', grounded: false, jumpPressed: false, type: 'fire' };
const p2 = { startX: 880, startY: 500, x: 880, y: 500, w: 26, h: 26, vx: 0, vy: 0, color: '#1e90ff', grounded: false, jumpPressed: false, type: 'water' };

// Fizik Ayarları
const gravity = 0.55;
const jumpPower = -12.5;
const speed = 4.3;

// Rahat Tırmanılabilir Dengeli Platform Düzeni
const platforms = [
    { x: 0, y: 540, w: 1000, h: 40 }, // Ana Zemin
    // Kat 1 (y: 430)
    { x: 0, y: 430, w: 280, h: 16 },
    { x: 360, y: 430, w: 280, h: 16 },
    { x: 720, y: 430, w: 280, h: 16 },
    // Kat 2 (y: 320) - Genişletilmiş ve tırmanması kolaylaştırılmış
    { x: 100, y: 320, w: 300, h: 16 },
    { x: 600, y: 320, w: 300, h: 16 },
    // Kat 3 (y: 210)
    { x: 0, y: 210, w: 220, h: 16 },
    { x: 300, y: 210, w: 400, h: 16 }, // Butonlu orta platform
    { x: 780, y: 210, w: 220, h: 16 },
    // Kat 4 - Sona Çıkış Platformları (y: 100)
    { x: 0, y: 100, w: 250, h: 16 },   // Sol üst (Ateş Portalı)
    { x: 750, y: 100, w: 250, h: 16 }   // Sağ üst (Su Portalı)
];

// Tehlikeli Sıvı Havuzları (2. Kattaki küçük tuzaklar rahat geçiş için daraltıldı)
const hazards = [
    { x: 285, y: 535, w: 70, h: 10, type: 'fire', color: '#ff4757' },
    { x: 645, y: 535, w: 70, h: 10, type: 'water', color: '#1e90ff' },
    { x: 450, y: 535, w: 100, h: 10, type: 'acid', color: '#2ed573' },
    { x: 440, y: 425, w: 120, h: 10, type: 'acid', color: '#2ed573' },
    // 2. Kat Küçük Asit Tuzakları (Ortaya çekilip daraltıldı, rahatça üst katlara zıplanabiliyor)
    { x: 230, y: 315, w: 40, h: 10, type: 'acid', color: '#2ed573' },
    { x: 730, y: 315, w: 40, h: 10, type: 'acid', color: '#2ed573' }
];

// Düğme ve Kilitli Engel
const button = { x: 485, y: 202, w: 30, h: 8, pressed: false };
const gate = { x: 150, y: 0, w: 16, h: 100, active: true };

// Portallar
const portals = [
    { x: 80, y: 55, r: 24, color: '#ff4757' },
    { x: 880, y: 55, r: 24, color: '#1e90ff' }
];

function bindTouch(id, keyName) {
    const btn = document.getElementById(id);
    const start = (e) => { e.preventDefault(); keys[keyName] = true; };
    const end = (e) => { e.preventDefault(); keys[keyName] = false; };

    btn.addEventListener('touchstart', start, {passive: false});
    btn.addEventListener('touchend', end, {passive: false});
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
}

bindTouch('redLeft', 'a');
bindTouch('redUp', 'w');
bindTouch('redRight', 'd');

bindTouch('blueLeft', 'ArrowLeft');
bindTouch('blueUp', 'ArrowUp');
bindTouch('blueRight', 'ArrowRight');

window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Bireysel Doğma Fonksiyonları
function resetP1() {
    p1.x = p1.startX; p1.y = p1.startY; p1.vx = 0; p1.vy = 0;
}
function resetP2() {
    p2.x = p2.startX; p2.y = p2.startY; p2.vx = 0; p2.vy = 0;
}

function updatePlayer(p, leftKey, rightKey, upKey) {
    if (keys[leftKey]) p.vx = -speed;
    else if (keys[rightKey]) p.vx = speed;
    else p.vx = 0;

    if (keys[upKey]) {
        if (p.grounded && !p.jumpPressed) {
            p.vy = jumpPower;
            p.grounded = false;
            p.jumpPressed = true;
        }
    } else {
        p.jumpPressed = false;
    }

    p.vy += gravity;
    p.x += p.vx;
    p.y += p.vy;

    p.grounded = false;

    // Platform Çarpışmaları & Kafa Çarpma
    for (let plat of platforms) {
        if (p.x < plat.x + plat.w &&
            p.x + p.w > plat.x &&
            p.y < plat.y + plat.h &&
            p.y + p.h > plat.y) {
            
            if (p.vy > 0 && (p.y + p.h - p.vy) <= plat.y + 8) {
                p.y = plat.y - p.h;
                p.vy = 0;
                p.grounded = true;
            } 
            else if (p.vy < 0 && (p.y - p.vy) >= plat.y + plat.h - 8) {
                p.y = plat.y + plat.h;
                p.vy = 0;
            }
        }
    }

    // Kapı Engeli
    if (gate.active) {
        if (p.x < gate.x + gate.w && p.x + p.w > gate.x &&
            p.y < gate.y + gate.h && p.y + p.h > gate.y) {
            if (p.vx > 0) p.x = gate.x - p.w;
            if (p.vx < 0) p.x = gate.x + gate.w;
        }
    }

    // Bireysel Ölmeli Tuzak Kontrolü
    for (let h of hazards) {
        if (p.x < h.x + h.w && p.x + p.w > h.x &&
            p.y < h.y + h.h && p.y + p.h > h.y) {
            if (h.type === 'acid' || (h.type === 'fire' && p.type === 'water') || (h.type === 'water' && p.type === 'fire')) {
                if (p === p1) resetP1();
                else resetP2();
            }
        }
    }

    if (p.x < 0) p.x = 0;
    if (p.x + p.w > canvas.width) p.x = canvas.width - p.w;
}

function checkMechanics() {
    let p1OnBtn = (p1.x < button.x + button.w && p1.x + p1.w > button.x && p1.y + p1.h >= button.y && p1.y + p1.h <= button.y + 12);
    let p2OnBtn = (p2.x < button.x + button.w && p2.x + p2.w > button.x && p2.y + p2.h >= button.y && p2.y + p2.h <= button.y + 12);

    if (p1OnBtn || p2OnBtn) {
        button.pressed = true;
        gate.active = false;
    } else {
        button.pressed = false;
        gate.active = true;
    }

    if (currentLevel === 1) {
        let p1In = Math.hypot((p1.x + p1.w/2) - portals[0].x, (p1.y + p1.h/2) - portals[0].y) < 35;
        let p2In = Math.hypot((p2.x + p2.w/2) - portals[1].x, (p2.y + p2.h/2) - portals[1].y) < 35;

        if (p1In && p2In) {
            document.getElementById('msgTitle').innerText = "LEVEL 1 COMPLETED!";
            document.getElementById('msgSub').innerText = "Awesome teamwork! Portals unlocked.";
            document.getElementById('msgBtn').innerText = "Go to Level 2";
            document.getElementById('levelMessage').style.display = 'block';
        }
    }
}

function nextLevel() {
    currentLevel = 2;
    document.getElementById('levelMessage').style.display = 'none';
    document.getElementById('backBtn').style.display = 'block';
}

function backToLevel1() {
    currentLevel = 1;
    resetP1();
    resetP2();
    document.getElementById('backBtn').style.display = 'none';
}

function drawPortals() {
    portalAnim += 0.05;
    for (let p of portals) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.beginPath();
        ctx.arc(0, 0, p.r + Math.sin(portalAnim) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 15;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, p.r - 8, 0, Math.PI * 2);
        ctx.fillStyle = p.color + '66';
        ctx.fill();
        ctx.restore();
    }
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (currentLevel === 1) {
        updatePlayer(p1, 'a', 'd', 'w');
        updatePlayer(p2, 'ArrowLeft', 'ArrowRight', 'ArrowUp');
        checkMechanics();

        // Platform Çizimi
        ctx.fillStyle = '#2b2b3d';
        for (let plat of platforms) {
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        }

        // Sıvı Havuzları
        for (let h of hazards) {
            ctx.fillStyle = h.color;
            ctx.shadowColor = h.color;
            ctx.shadowBlur = 8;
            ctx.fillRect(h.x, h.y, h.w, h.h);
        }
        ctx.shadowBlur = 0;

        // Düğme
        ctx.fillStyle = button.pressed ? '#eccc68' : '#ffa502';
        ctx.fillRect(button.x, button.y + (button.pressed ? 4 : 0), button.w, button.h - (button.pressed ? 4 : 0));

        // Kilitli Kapı Barikatı
        if (gate.active) {
            ctx.fillStyle = '#ffa502';
            ctx.shadowColor = '#ffa502';
            ctx.shadowBlur = 10;
            ctx.fillRect(gate.x, gate.y, gate.w, gate.h);
            ctx.shadowBlur = 0;
        }

        drawPortals();

        // Karakterler
        ctx.fillStyle = p1.color;
        ctx.shadowColor = p1.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(p1.x, p1.y, p1.w, p1.h);

        ctx.fillStyle = p2.color;
        ctx.shadowColor = p2.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
        ctx.shadowBlur = 0;

    } else if (currentLevel === 2) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 46px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.fillText("LEVEL 2", canvas.width / 2, canvas.height / 2 - 60);

        ctx.font = 'bold 30px Arial';
        ctx.fillStyle = '#00d2ff';
        ctx.shadowColor = '#00d2ff';
        ctx.shadowBlur = 15;
        ctx.fillText("COMING SOON...", canvas.width / 2, canvas.height / 2 - 5);
        ctx.shadowBlur = 0;
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
